name: Tests

on:
  push:
    branches: [main, feature/dsx-dependency-gather]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libgl1
      - run: python -m pip install -e . pytest ruff
      - run: python -m compileall -q forge tests
      - run: ruff check forge --select E4,E7,E9,F
      - run: python -m pytest -q
